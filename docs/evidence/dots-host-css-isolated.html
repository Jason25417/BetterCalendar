<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BC 宿主布局机制隔离复现</title><style>
*{box-sizing:border-box}body{font:16px/1.5 system-ui;margin:24px;color:#17251e;background:#f5f6f4}h1{font-size:22px}h2{font-size:18px}p{max-width:768px}.row{display:flex;align-items:flex-end;width:768px;max-width:100%;margin-bottom:24px;background:#e1e7e0;min-height:260px}.bubble{flex:0 1 auto;min-width:0;max-width:min(88%,calc(100% - 73px))}.line{display:flex;align-items:flex-end;min-width:0}.content{display:flex;align-items:flex-start;min-width:0;max-width:100%}.card{container-type:inline-size;display:flex;flex-direction:column;overflow:hidden;border:1px solid #999;border-radius:18px;min-width:0;background:white}.card form{display:flex;flex-direction:column;max-height:500px;min-height:0;outline:none}.body{padding:20px;overflow:auto}.body h3{margin:0 0 12px}.footer{display:flex;flex-wrap:wrap;gap:12px;padding:16px;border-top:1px solid #ddd}.footer button{padding:10px 16px;white-space:nowrap}.fixed .bubble{inline-size:min(32rem,calc(100% - 73px))}.fixed .line,.fixed .content,.fixed .card,.fixed form{inline-size:100%}.small{width:358px}output{white-space:pre-wrap}label{display:block;margin-top:16px}
</style><h1>宿主尺寸机制隔离复现（假数据）</h1><p>这是独立静态样本，不连接 BC、Dots、日历或计时。不是线上修复，也不代表 iPhone 真机通过。绿色区域表示外行可用宽度。按钮没有执行能力。</p>
<div id="proof"></div><script>
const root=document.getElementById('proof');for(const [id,label,classes]of[['before','自动宽度 + inline-size containment',''],['after','候选宿主修复：审批专用外层有明确 inline-size','fixed'],['narrow','候选修复：358px 可用区域','fixed small']]){const section=document.createElement('section');section.innerHTML=`<h2>${label}</h2><article id="${id}" class="row ${classes}"><div class="bubble"><div class="line"><div class="content"><div class="card"><form><div class="body"><h3>确认修改联调测试事项</h3><div>设备：测试 Mac</div><div>备注：（空白） → 测试备注</div><div>有效至：明日 16:00（示例）</div><label><input type="checkbox"> 我已核对具体改动</label></div><div class="footer"><button type="button">取消（无执行）</button><button type="button">确认（无执行）</button></div></form></div></div></div></div></article>`;root.append(section)}
</script></html>
